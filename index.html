<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Limbus Company - 인격 도감</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         헤더
    ========================== -->
    <header class="header">

        <div class="logo">
            LIMBUS
            <span>COMPANY</span>
        </div>

        <div class="header-title">
            인격 도감
        </div>

    </header>


    <!-- =========================
         메인
    ========================== -->
    <main class="container">

        <!-- 검색 -->
        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="인격 이름, 수감자, 키워드, 스킬 등을 검색..."
            >

        </section>


        <!-- 필터 -->
        <section class="filter-section">

            <select id="seasonFilter">
                <option value="all">모든 시즌</option>
            </select>

            <select id="sinnerFilter">
                <option value="all">모든 수감자</option>
            </select>

            <select id="gradeFilter">
                <option value="all">모든 등급</option>
                <option value="3">★★★</option>
                <option value="2">★★</option>
                <option value="1">★</option>
            </select>

            <select id="typeFilter">
                <option value="all">모든 공격 유형</option>
                <option value="참격">참격</option>
                <option value="관통">관통</option>
                <option value="타격">타격</option>
            </select>

        </section>


        <!-- 시즌 -->
        <section class="season-section">

            <h1 id="seasonTitle">
                모든 인격
            </h1>

            <div
                id="identityGrid"
                class="identity-grid">
            </div>

            <div
                id="noResult"
                class="no-result hidden">

                검색 결과가 없습니다.

            </div>

        </section>

    </main>


    <!-- =========================
         상세 정보 모달
    ========================== -->

    <div
        id="detailModal"
        class="modal hidden">

        <div class="modal-background"></div>

        <div class="modal-content">

            <button
                id="closeModal"
                class="close-button">
                ×
            </button>

            <div id="identityDetail"></div>

        </div>

    </div>


    <script src="data.js"></script>
    <script src="script.js"></script>

</body>
</html>
